<!--
  Skeleton loading shell for app routes (injected into #root of app.html by
  scripts/prerender.mjs).

  Why static markup + CSS only:
    * The template's <meta http-equiv="Content-Security-Policy"> allows
      'unsafe-inline' for styles but NOT for scripts, so an inline <script>
      would be blocked — plain markup and a <style> block are not.
    * React mounts with createRoot().render(), which removes everything inside
      #root on first render, so this block (and its <style>) disappears by
      itself — no cleanup code needed.

  Shown only on non-"/" routes (app.html); "/" keeps the prerendered landing.
-->
<style>
  .appskel {
    position: fixed;
    inset: 0;
    z-index: 2147483000;
    background: #f0f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .appskel__bar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 64px;
    padding: 0 20px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
  }
  .appskel__body {
    padding: 28px 20px;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .appskel__grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }
  .appskel__spacer { flex: 1 1 auto; }
  .sk {
    display: block;
    border-radius: 8px;
    background: #e2e8f0;
    background-image: linear-gradient(90deg, #e2e8f0 0%, #eef1f5 50%, #e2e8f0 100%);
    background-size: 200% 100%;
    animation: appskel-shimmer 1.4s ease-in-out infinite;
  }
  .sk--circle { width: 32px; height: 32px; border-radius: 9999px; }
  .sk--text { height: 12px; }
  .sk--pill { height: 28px; border-radius: 10px; }
  .sk--card { height: 92px; border-radius: 12px; background-color: #ffffff; }
  .sk--block { height: 220px; border-radius: 12px; background-color: #ffffff; }
  @keyframes appskel-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @media (max-width: 767px) {
    .appskel__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sk { animation: none; }
  }
</style>
<div class="appskel" aria-hidden="true">
  <div class="appskel__bar">
    <span class="sk sk--circle"></span>
    <span class="sk sk--text" style="width:96px"></span>
    <span class="appskel__spacer"></span>
    <span class="sk sk--pill" style="width:76px"></span>
    <span class="sk sk--pill" style="width:92px"></span>
  </div>
  <div class="appskel__body">
    <span class="sk sk--text" style="width:190px;height:22px"></span>
    <div class="appskel__grid">
      <span class="sk sk--card"></span>
      <span class="sk sk--card"></span>
      <span class="sk sk--card"></span>
      <span class="sk sk--card"></span>
    </div>
    <span class="sk sk--text" style="width:140px"></span>
    <span class="sk sk--block"></span>
  </div>
</div>
